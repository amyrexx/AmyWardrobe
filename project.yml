name: AmyWardrobe
options:
  bundleIdPrefix: com.amywardrobe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AmyWardrobe:
    type: application
    platform: iOS
    sources:
      - path: AmyWardrobe
    info:
      path: AmyWardrobe/Info.plist
      properties:
        CFBundleDisplayName: AmyWardrobe
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Камера нужна, чтобы сфотографировать вещь для гардероба."
        NSPhotoLibraryAddUsageDescription: "Доступ нужен, чтобы сохранять коллажи и образы в «Фото»."
        NSLocalNetworkUsageDescription: "Нужно только если вы вручную подключили собственный сервер примерки в локальной сети."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amywardrobe.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  AmyWardrobeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AmyWardrobeTests
    dependencies:
      - target: AmyWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amywardrobe.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AmyWardrobe:
    build:
      targets:
        AmyWardrobe: all
        AmyWardrobeTests: [test]
    test:
      targets:
        - AmyWardrobeTests
      gatherCoverageData: false
